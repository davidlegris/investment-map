<!DOCTYPE html>
<html lang="en">

<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Investment Data / Données de placement</title>
	
	<link rel="icon" type="image/x-icon" href="money.png" />

    <!-- Load Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>
    
    <!-- Load MarkerCluster CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Load scripts asynchronously -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Links to CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Add style to hide content until language is selected -->
    <style>
        #map, #search-container {
            display: none;
        }
    </style>
</head>

<body>
	<div id='map'></div>
	<div id='side-panel'></div>
    <div id='floating-header'>
        <div id="header-text">
            <span id="english-text">Investment Data</span>
            <span id="french-text">Données de placement</span>
        </div>
    </div>

	<!-- JavaScript functionality -->
	<script type="module" src="map.js"></script>
</body>

</html>
